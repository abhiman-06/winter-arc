<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter Arc</title>
<meta name="description" content="Track habits, tasks and 1-year goals through your winter arc.">
<meta name="theme-color" content="#2dd4bf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
</head>
<body>

<div class="frame">
  <header class="topbar">
    <div class="brand" id="pageTitle">TODAY</div>

    <nav class="nav" id="nav">
      <button class="nav-btn is-active" data-page="today">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Today</span>
      </button>
      <button class="nav-btn" data-page="habits">
        <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Habits</span>
      </button>
      <button class="nav-btn" data-page="tasks">
        <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg><span>Tasks</span>
      </button>
      <button class="nav-btn" data-page="goals">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg><span>Goals</span>
      </button>
      <button class="nav-btn" data-page="insights">
        <svg viewBox="0 0 24 24" class="ico"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>Insights</span>
      </button>
    </nav>

    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="view" class="view"></main>
</div>

<div class="dots" id="dots" role="tablist" aria-label="Pages"></div>

<!-- modal host -->
<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Title</h2>
      <button class="icon-btn sm" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" class="ico"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/habits.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/goals.js"></script>
<script src="js/views/insights.js"></script>
<script src="js/app.js"></script>
</body>
</html>
